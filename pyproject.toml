[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexarc"
version = "0.2.0"
description = "A nervous system for desktop pets - instinct-driven companions that actually feel alive"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lumenform" }]
keywords = ["desktop-pet", "petdex", "laya", "agent", "ambient"]
classifiers = [
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]

dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6", "psutil>=5.9"]
intuition = ["laya>=0.3.28"]

[project.scripts]
reflexarc = "reflexarc.cli:main"
