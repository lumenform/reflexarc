name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core dependencies
        run: python -m pip install --upgrade pip
      - name: Import check
        run: python -c "import reflexarc, reflexarc.sim, reflexarc.brain, reflexarc.drives, reflexarc.personality, reflexarc.senses, reflexarc.gaze, reflexarc.motion; print('imports ok')"
      - name: Gaze maths
        run: python -m tests.gaze_math
      - name: Motion physics
        run: python -m tests.motion_physics
      - name: Behaviour scenario test
        env:
          REFLEXARC_HOME: ${{ runner.temp }}/reflexarc-ci
        run: python -m tests.scenario
